        const SERVERS_PAGE_URL = 'https://admin161723.github.io/Server_MafiaSun10000.20/';

        const AVATARS = {

                        this.userId = Date.now().toString();

                } catch(e) {
                    console.warn('حالت آفلاین - استفاده از اطلاعات محلی');
                    // اگر به سرور دسترسی نبود، از localStorage اطلاعات قبلی رو می‌گیریم
                    const localData = localStorage.getItem('mafiaSun_userData');
                    if (localData) {
                        const parsed = JSON.parse(localData);
                        Object.assign(this, parsed);
                    }
                }
                this.updateAllDisplays();
            },

            async saveAllUsers() {
                const userData = {
                    userName: this.userName,
                    gems: this.userGems,
                    coins: this.userCoins,
                    currentAvatar: this.currentAvatar,
                    editCount: this.editCount,
                    userStats: this.userStats,
                    hasBlueTick: this.hasBlueTick,
                    hasOrangeTick: this.hasOrangeTick,
                    hasBrownTick: this.hasBrownTick,
                    ownedAvatars: this.ownedAvatars
                };
                // همیشه یه نسخه محلی نگه می‌داریم
                localStorage.setItem('mafiaSun_userData', JSON.stringify(userData));
                try {
                    const resp = await fetch(JSONBIN_URL, { headers: { 'X-Master-Key': JSONBIN_KEY } });
                    const data = await resp.json();
                    const users = data.record?.users || {};
                    users[this.userId] = userData;
                    await fetch(JSONBIN_URL, {
                        method: 'PUT',
                        headers: { 'X-Master-Key': JSONBIN_KEY, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ users })
                    });
                } catch(e) { console.warn('ذخیره روی سرور ناموفق - اطلاعات محلی ذخیره شد'); }
            },

            getAvatarImage(avatar) { return this.avatars[avatar] || this.avatars.avatar1; },
            showNotification(msg) {
                const n = document.getElementById('copyNotification'); if(!n) return;
                n.textContent = msg; n.style.display='block';
                setTimeout(()=> n.style.display='none', 2000);
            },
            updateAllDisplays() {
                this.updateMainProfile(); this.updateProfilePage(); this.updateMyAvatars(); this.updateShopAvatars();
                document.getElementById('gemDisplay').textContent = this.userGems.toLocaleString('fa-IR');
                document.getElementById('coinDisplay').textContent = this.userCoins.toLocaleString('fa-IR');
                document.getElementById('userIdDisplay').textContent = this.userId;
            },
            updateMainProfile() {
                document.getElementById('mainProfileAvatar').innerHTML = `<img src="${this.getAvatarImage(this.currentAvatar)}">`;
                let nameHtml = this.userName;
                if(this.hasBlueTick) nameHtml = `<i class="fas fa-check-circle" style="color:#3b9eff;"></i> ${this.userName}`;
                else if(this.hasOrangeTick) nameHtml = `<i class="fas fa-check-circle" style="color:#ffaa00;"></i> ${this.userName}`;
                else if(this.hasBrownTick) nameHtml = `<i class="fas fa-check-circle" style="color:#8B4513;"></i> ${this.userName}`;
                document.getElementById('mainProfileName').innerHTML = nameHtml;
                document.getElementById('mainProfileLevel').textContent = this.hasBlueTick ? 'مدیریت' : (this.hasOrangeTick ? 'ناظر' : (this.hasBrownTick ? 'ادمین' : 'سطح ۱'));
            },
            updateProfilePage() {
                document.getElementById('profileAvatarImg').src = this.getAvatarImage(this.currentAvatar);
                let nameHtml = this.userName;
                if(this.hasBlueTick) nameHtml = `<i class="fas fa-check-circle" style="color:#3b9eff;"></i> ${this.userName}`;
                else if(this.hasOrangeTick) nameHtml = `<i class="fas fa-check-circle" style="color:#ffaa00;"></i> ${this.userName}`;
                else if(this.hasBrownTick) nameHtml = `<i class="fas fa-check-circle" style="color:#8B4513;"></i> ${this.userName}`;
                document.getElementById('profileUserName').innerHTML = nameHtml;
                document.getElementById('profileLevelBadge').textContent = this.hasBlueTick ? 'مدیریت' : (this.hasOrangeTick ? 'ناظر' : (this.hasBrownTick ? 'ادمین' : 'سطح ۱'));
                document.getElementById('rankName').textContent = this.hasBlueTick ? 'مدیریت' : (this.hasOrangeTick ? 'ناظر' : (this.hasBrownTick ? 'ادمین' : 'تازه‌وارد'));
                document.getElementById('rankTag').textContent = this.hasBlueTick ? 'طلایی' : (this.hasOrangeTick ? 'نارنجی' : (this.hasBrownTick ? 'قهوه‌ای' : 'برنزی'));
                document.getElementById('winCount').textContent = this.userStats.wins;
                document.getElementById('loseCount').textContent = this.userStats.losses;
                document.getElementById('hoursPlayed').textContent = this.userStats.totalHours;
                document.getElementById('observerCount').textContent = this.userStats.observerCount;
            },
            updateMyAvatars() {
                const grid = document.getElementById('myAvatarsGrid');
                let html = '';
                [...Object.entries(this.avatars)].forEach(([id, url]) => {
                    if(this.ownedAvatars.includes(id)) {
                        html += `<div class="avatar-card ${this.currentAvatar===id?'selected':''}" onclick="app.selectAvatar('${id}')">
                            <div class="avatar-thumb"><img src="${url}"></div>
                            <div class="avatar-number">${id}</div>
                            <button class="select-button" onclick="app.selectAvatar('${id}');event.stopPropagation();">انتخاب</button>
                        </div>`;
                    }
                });
                grid.innerHTML = html || '<div style="color:white;text-align:center;padding:40px;">آواتاری ندارید</div>';
            },
            updateShopAvatars() {
                document.getElementById('shopGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;"><div style="font-size:80px;color:#f9d77e;">🛒</div><div style="font-size:32px;color:white;">به زودی</div></div>';
            },
            selectAvatar(id) {
                this.currentAvatar = id; this.saveAllUsers(); this.updateMyAvatars(); this.updateMainProfile(); this.updateProfilePage(); this.showNotification('✅ آواتار تغییر کرد');
            },
            openProfilePage() { document.getElementById('main-game-page').style.display='none'; document.getElementById('profile-page').style.display='block'; this.updateProfilePage(); },
            closeProfilePage() { document.getElementById('profile-page').style.display='none'; document.getElementById('main-game-page').style.display='block'; },
            openAvatarPage() { document.getElementById('avatar-page').style.display='block'; this.updateMyAvatars(); },
            closeAvatarPage() { document.getElementById('avatar-page').style.display='none'; this.updateProfilePage(); this.updateMainProfile(); },
            switchAvatarTab(tab) {
                document.querySelectorAll('.avatar-tab').forEach(t=>t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
                if(tab==='my') { document.querySelector('.avatar-tab').classList.add('active'); document.getElementById('myAvatarsPanel').classList.add('active'); }
                else { document.querySelectorAll('.avatar-tab')[1].classList.add('active'); document.getElementById('shopPanel').classList.add('active'); }
            },
            copyUserId() { navigator.clipboard?.writeText(this.userId); this.showNotification('✅ کپی شد'); },
            openEditModal() {
                document.getElementById('editModal').style.display='block';
                document.getElementById('editNameInput').value = this.userName;
                const coinMsg = document.getElementById('coinRequiredMessage');
                if(this.hasBlueTick||this.hasOrangeTick||this.hasBrownTick) { coinMsg.style.display='none'; document.getElementById('modalTitle').innerHTML='تغییر نام (رایگان)'; }
                else if(this.editCount===0) { coinMsg.style.display='none'; document.getElementById('modalTitle').innerHTML='تغییر نام (رایگان)'; }
                else { coinMsg.style.display='flex'; document.getElementById('modalTitle').innerHTML='تغییر نام (۵ سکه)'; }
            },
            closeEditModal() { document.getElementById('editModal').style.display='none'; },
            saveUserName() {
                const input = document.getElementById('editNameInput');
                let name = input.value.trim();
                if(!name || name.length<2 || name.length>12) { alert('نام باید ۲ تا ۱۲ حرف باشد'); return; }
                if(!this.hasBlueTick && !this.hasOrangeTick && !this.hasBrownTick && this.editCount>0 && this.userCoins<5) { alert('سکه کافی ندارید'); return; }
                if(!this.hasBlueTick && !this.hasOrangeTick && !this.hasBrownTick && this.editCount>0) this.userCoins -= 5;
                this.userName = name; this.editCount++;
                this.saveAllUsers(); this.updateAllDisplays(); this.closeEditModal();
                this.showNotification('✅ نام تغییر کرد');
            },
            openShop() { window.location.href = STORE_PAGE_URL; },
            openServersPage() { window.location.href = SERVERS_PAGE_URL; },
            openCompetitive() { this.showNotification('🏆 به زودی'); },
            openCup() { this.showNotification('🏆 به زودی'); },
            openClan() { this.showNotification('👥 به زودی'); }
        };

        window.addEventListener('DOMContentLoaded', () => App.loadAllUsers());
        window.app = App;
    </script>
</body>
</html>
