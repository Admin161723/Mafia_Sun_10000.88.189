<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مافیا سان | صفحه اصلی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --gold: #f0c040;
            --red: #c0392b;
            --green: #27ae60;
            --card: rgba(18, 18, 35, 0.85);
            --border: #2a2a40;
            --bg-dark: #0a0c10;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-dark);
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* لودینگ */
        .loading-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://cdn.imgurl.ir/uploads/i13489_file_00000000ce4071fd96295e0893579ed1.png') center/cover;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .loading-circle {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-progress {
            width: 200px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .loading-progress div {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), #ffaa00);
            border-radius: 6px;
            transition: width 0.2s;
        }

        .version-text {
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
        }

        #appContainer {
            flex: 1;
            display: none;
            overflow: hidden;
            position: relative;
        }

        #gamePage {
            display: none;
            width: 100%;
            height: 100%;
            background: url('https://s8.uupload.ir/files/file_00000000ce4071fd96295e0893579ed1_9q9n.png') center/cover;
            position: relative;
            flex-direction: column;
        }

        .game-header {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .resource-badge {
            background: var(--card);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .profile-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            backdrop-filter: blur(8px);
            padding: 5px 15px 5px 5px;
            border-radius: 30px;
            border: 1px solid var(--border);
            cursor: pointer;
            z-index: 10;
        }

        .profile-btn img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--gold);
        }

        .admin-gear {
            position: absolute;
            top: 15px;
            left: 150px;
            background: var(--card);
            backdrop-filter: blur(8px);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border);
            z-index: 10;
            color: var(--gold);
        }

        .game-buttons {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 50px;
        }

        .game-btn {
            width: 140px;
            height: 140px;
            cursor: pointer;
            transition: 0.2s;
        }

        .game-btn:active {
            transform: scale(0.95);
        }

        .game-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6));
        }

        .bottom-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 60px;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .bar-item {
            width: 42px;
            height: 42px;
            cursor: pointer;
        }

        .bar-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overlay-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-box {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .avatar-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .avatar-item.selected {
            border-color: var(--gold);
        }

        .avatar-item img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .avatar-item .price {
            font-size: 0.7rem;
            color: var(--gold);
            margin-top: 4px;
        }

        .stat-row {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .stat-cell {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 4000;
            padding: 20px;
            overflow-y: auto;
        }

        .admin-content {
            background: #1e1e30;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .admin-content table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-size: 0.8rem;
        }

        .admin-content th, .admin-content td {
            padding: 10px 5px;
            border-bottom: 1px solid #333;
            text-align: center;
            vertical-align: middle;
        }

        .btn-small {
            padding: 5px 10px;
            border-radius: 8px;
            border: none;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
            margin: 2px;
        }

        .btn-ban {
            background: #c0392b;
            color: white;
        }

        .btn-unban {
            background: #27ae60;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 10px 25px;
            border-radius: 25px;
            z-index: 5000;
            border: 1px solid var(--gold);
            font-size: 0.9rem;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: var(--gold);
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab {
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #aaa;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tab.active {
            background: var(--gold);
            color: #000;
        }

        .copy-id {
            cursor: pointer;
            margin-right: 5px;
            color: var(--gold);
        }

        .banned-badge {
            background: #c0392b;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-right: 5px;
        }

        /* تیک دایره‌ای توخالی با تیک همرنگ */
        .role-tick {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-width: 2px;
            border-style: solid;
            background: transparent;
            margin-left: 5px;
            vertical-align: middle;
        }
        .role-tick i {
            font-size: 10px;
        }
        .tick-blue { border-color: #3498db; color: #3498db; }
        .tick-black { border-color: #2c3e50; color: #2c3e50; }
        .tick-brown { border-color: #a0522d; color: #a0522d; }
        .tick-orange { border-color: #e67e22; color: #e67e22; }
        .tick-white { border-color: #ecf0f1; color: #ecf0f1; text-shadow: 0 0 2px rgba(0,0,0,0.5); }

        /* صفحه لاگین */
        .login-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 6000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1a1a2e;
            border-radius: 30px;
            padding: 30px 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--gold);
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
        }
        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
    </style>
</head>

        function getRoleTitle(role) {
            switch(role) {
                case 'creator': return 'سازنده';
                case 'support': return 'پشتیبانی';
                case 'senior_admin': return 'ادمین ارشد';
                case 'admin': return 'ادمین';
                case 'observer': return 'ناظر';
                case 'leader': return 'لیدر';
                default: return 'عادی';
            }
        }

        // بارگذاری از JSONBin
        async function loadDB() {
            try {
                const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                const data = await res.json();
                db = data.record || db;
                if(!db.lastUID) db.lastUID = 0;
                localStorage.setItem('mafia_db_backup', JSON.stringify(db));
            } catch(e) {
                const backup = localStorage.getItem('mafia_db_backup');
                if(backup) db = JSON.parse(backup);
            }
            await ensureSpecials();
        }

        async function saveDB() {
            try {
                await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(db)
                });
                localStorage.setItem('mafia_db_backup', JSON.stringify(db));
            } catch(e) { console.warn('ذخیره روی سرور ناموفق'); }
        }

        // اطمینان از وجود کاربران ویژه و اختصاص UID عددی به آنها
        async function ensureSpecials() {
            let updated = false;
            for(const s of SPECIALS) {
                if(!db.users[s.phone]) {
                    db.lastUID = (db.lastUID || 0) + 1;
                    db.users[s.phone] = {
                        phone: s.phone,
                        password: s.pass,
                        name: s.name,
                        uid: db.lastUID,
                        age: 25,
                        role: s.role,
                        gems: Infinity,
                        coins: Infinity,
                        avatar: 'avatar1',
                        ownedAvatars: Object.keys(AVATARS),
                        editCount: 0,
                        stats: { wins:0, losses:0, hours:0, obs:0 },
                        banned: false
                    };
                    updated = true;
                } else {
                    const user = db.users[s.phone];
                    if(!user.uid) { user.uid = ++db.lastUID; updated = true; }
                    if(user.banned === undefined) user.banned = false;
                    if(!user.ownedAvatars) user.ownedAvatars = Object.keys(AVATARS);
                    if(!user.stats) user.stats = { wins:0, losses:0, hours:0, obs:0 };
                    if(user.gems === undefined) user.gems = Infinity;
                    if(user.coins === undefined) user.coins = Infinity;
                    if(!user.role) user.role = s.role;
                }
            }
            if(updated) await saveDB();
        }

        // ثبت‌نام کاربر جدید
        async function registerUser(phone, password) {
            if(db.users[phone]) return { ok: false, msg: 'شماره قبلاً ثبت شده است' };
            if(phone.length < 6 || password.length < 4) return { ok: false, msg: 'شماره یا رمز نامعتبر' };
            db.lastUID = (db.lastUID || 0) + 1;
            const newUser = {
                phone: phone,
                password: password,
                name: `کاربر${db.lastUID}`,
                uid: db.lastUID,
                age: 18,
                role: 'normal',
                gems: 100,
                coins: 600,
                avatar: 'avatar1',
                ownedAvatars: ['avatar1','avatar2'],
                editCount: 0,
                stats: { wins:0, losses:0, hours:0, obs:0 },
                banned: false
            };
            db.users[phone] = newUser;
            await saveDB();
            return { ok: true, user: newUser };
        }

        // ورود کاربر
        async function loginUser(phone, password) {
            const user = db.users[phone];
            if(!user) return { ok: false, msg: 'کاربر یافت نشد' };
            if(user.password !== password) return { ok: false, msg: 'رمز اشتباه است' };
            if(user.banned) return { ok: false, msg: 'حساب شما مسدود شده است' };
            return { ok: true, user: user };
        }

        // نمایش صفحه اصلی بازی
        function showGamePage() {
            document.getElementById('loadingPage').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('gamePage').style.display = 'flex';
            document.getElementById('loginOverlay').style.display = 'none';
            updateUI();
        }

        function showLoginPage() {
            document.getElementById('loadingPage').style.display = 'none';
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        function updateUI() {
            if(!currentUser) return;
            document.getElementById('gemVal').innerText = currentUser.gems === Infinity ? '∞' : currentUser.gems;
            document.getElementById('coinVal').innerText = currentUser.coins === Infinity ? '∞' : currentUser.coins;
            document.getElementById('mainAvatarImg').src = AVATARS[currentUser.avatar]?.url || AVATARS.avatar1.url;
            const tickHtml = getTickBadge(currentUser.role);
            document.getElementById('mainNameText').innerHTML = tickHtml ? tickHtml + ' ' + currentUser.name : currentUser.name;
            const isCreator = (currentUser.role === 'creator');
            document.getElementById('openAdminPanelBtn').style.display = isCreator ? 'flex' : 'none';
        }

        function toast(msg, type='info') {
            const old = document.querySelector('.toast');
            if(old) old.remove();
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            if(type === 'error') t.style.borderColor = '#e74c3c';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // ---------- رویدادهای دکمه‌ها ----------
        document.getElementById('shopBtn').onclick = () => window.location.href = SHOP_LINK;
        document.getElementById('serversBtn').onclick = () => window.location.href = 'https://admin161723.github.io/Server_MafiaSun10000.20/';
        ['competitiveBtn','cupBtn','clanBtn'].forEach(id => {
            document.getElementById(id).onclick = () => toast('به زودی');
        });

        // خروج
        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem(LOCAL_KEY);
            currentUser = null;
            showLoginPage();
        };

        // لاگین و ثبت‌نام
        document.getElementById('doLoginBtn').onclick = async () => {
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            if(!phone || !pass) return toast('لطفاً شماره و رمز را وارد کنید', 'error');
            const res = await loginUser(phone, pass);
            if(res.ok) {
                currentUser = res.user;
                localStorage.setItem(LOCAL_KEY, JSON.stringify({ phone: currentUser.phone }));
                showGamePage();
                toast(`خوش آمدید ${currentUser.name}`);
            } else {
                toast(res.msg, 'error');
            }
        };
        document.getElementById('doRegisterBtn').onclick = async () => {
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            if(!phone || !pass) return toast('لطفاً شماره و رمز را وارد کنید', 'error');
            const res = await registerUser(phone, pass);
            if(res.ok) {
                currentUser = res.user;
                localStorage.setItem(LOCAL_KEY, JSON.stringify({ phone: currentUser.phone }));
                showGamePage();
                toast(`ثبت‌نام موفق! خوش آمدید ${currentUser.name}`);
            } else {
                toast(res.msg, 'error');
            }
        };

        // پروفایل
        document.getElementById('openProfileBtn').onclick = () => {
            if(!currentUser) return;
            document.getElementById('profileAvatarImg').src = AVATARS[currentUser.avatar]?.url || AVATARS.avatar1.url;
            const tickHtml = getTickBadge(currentUser.role);
            document.getElementById('profileNameText').innerHTML = tickHtml ? tickHtml + ' ' + currentUser.name : currentUser.name;
            document.getElementById('userIdSpan').innerText = currentUser.uid;
            document.getElementById('winStat').innerText = currentUser.stats?.wins || 0;
            document.getElementById('loseStat').innerText = currentUser.stats?.losses || 0;
            document.getElementById('hourStat').innerText = currentUser.stats?.hours || 0;
            document.getElementById('obsStat').innerText = currentUser.stats?.obs || 0;
            document.getElementById('profileOverlay').style.display = 'flex';
        };
        document.getElementById('closeProfileBtn').onclick = () => document.getElementById('profileOverlay').style.display = 'none';
        document.getElementById('copyUserIdBtn').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('userIdSpan').innerText).then(() => toast('کد کاربری کپی شد'));
        };

        // ویرایش نام
        document.getElementById('editNameBtn').onclick = () => {
            document.getElementById('editNameOverlay').style.display = 'flex';
            const hasTick = currentUser.role !== 'normal';
            const costMsg = (!hasTick && currentUser.editCount > 0) ? 'هزینه: ۵ سکه' : 'هزینه: رایگان';
            document.getElementById('editCostMsg').innerText = costMsg;
            document.getElementById('newNameInput').value = currentUser.name;
        };
        document.getElementById('closeEditBtn').onclick = () => document.getElementById('editNameOverlay').style.display = 'none';
        document.getElementById('saveNameBtn').onclick = async () => {
            const newName = document.getElementById('newNameInput').value.trim();
            if(newName.length < 2) return toast('نام باید حداقل ۲ کاراکتر باشد', 'error');
            const hasTick = currentUser.role !== 'normal';
            if(!hasTick && currentUser.editCount > 0 && currentUser.coins < 5) return toast('سکه کافی نیست', 'error');
            if(!hasTick && currentUser.editCount > 0) currentUser.coins -= 5;
            currentUser.name = newName;
            currentUser.editCount = (currentUser.editCount || 0) + 1;
            await saveDB();
            updateUI();
            document.getElementById('editNameOverlay').style.display = 'none';
            toast('نام با موفقیت تغییر کرد', 'success');
        };

        // آواتار (تغییر و خرید)
        function renderAvatars() {
            const myContainer = document.getElementById('myAvatarsPanel');
            const shopContainer = document.getElementById('shopAvatarsPanel');
            myContainer.innerHTML = '';
            shopContainer.innerHTML = '';

            for(const [key, av] of Object.entries(AVATARS)) {
                const card = document.createElement('div');
                card.className = 'avatar-item';
                if(currentUser.avatar === key) card.classList.add('selected');
                card.innerHTML = `<img src="${av.url}" alt="${key}">`;
                const owned = currentUser.ownedAvatars?.includes(key) || av.price === 0;
                if(av.price > 0 && !owned) {
                    card.innerHTML += `<div class="price">${av.price} جم</div>`;
                    card.onclick = async () => {
                        if(currentUser.gems < av.price) return toast('جم کافی نیست', 'error');
                        currentUser.gems -= av.price;
                        if(!currentUser.ownedAvatars) currentUser.ownedAvatars = ['avatar1','avatar2'];
                        currentUser.ownedAvatars.push(key);
                        currentUser.avatar = key;
                        await saveDB();
                        updateUI();
                        renderAvatars();
                        toast(`آواتار خریداری و فعال شد`, 'success');
                    };
                    shopContainer.appendChild(card);
                } else {
                    card.onclick = async () => {
                        currentUser.avatar = key;
                        await saveDB();
                        updateUI();
                        renderAvatars();
                        toast('آواتار تغییر کرد', 'success');
                    };
                    myContainer.appendChild(card);
                }
            }
        }

        document.getElementById('openAvatarEditorBtn').onclick = () => {
            if(!currentUser.ownedAvatars) currentUser.ownedAvatars = ['avatar1','avatar2'];
            renderAvatars();
            document.getElementById('avatarOverlay').style.display = 'flex';
            document.querySelectorAll('#avatarOverlay .tab').forEach(t => t.classList.remove('active'));
            document.querySelector('#avatarOverlay .tab[data-tab="my"]').classList.add('active');
            document.getElementById('myAvatarsPanel').style.display = 'grid';
            document.getElementById('shopAvatarsPanel').style.display = 'none';
        };
        document.getElementById('closeAvatarBtn').onclick = () => document.getElementById('avatarOverlay').style.display = 'none';
        document.querySelectorAll('#avatarOverlay .tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#avatarOverlay .tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const isMy = this.dataset.tab === 'my';
                document.getElementById('myAvatarsPanel').style.display = isMy ? 'grid' : 'none';
                document.getElementById('shopAvatarsPanel').style.display = isMy ? 'none' : 'grid';
            });
        });

        // ---------- پنل مدیریت (فقط سازنده) ----------
        document.getElementById('openAdminPanelBtn').onclick = () => {
            if(currentUser && currentUser.role === 'creator') {
                renderAdminTable();
                document.getElementById('adminOverlay').style.display = 'flex';
            } else {
                toast('شما دسترسی به پنل مدیریت ندارید', 'error');
            }
        };
        document.getElementById('closeAdminBtn').onclick = () => document.getElementById('adminOverlay').style.display = 'none';

        async function toggleBan(phone) {
            const user = db.users[phone];
            if(!user) return;
            if(user.role === 'creator') return toast('نمی‌توانید سازنده را بن کنید!', 'error');
            user.banned = !user.banned;
            await saveDB();
            renderAdminTable(document.getElementById('adminSearchInput').value);
            toast(`کاربر ${user.name} ${user.banned ? 'بن شد' : 'آنبن شد'}`, 'success');
            if(currentUser.phone === phone && user.banned) {
                // اگر کاربر فعلی بن شود، از حساب خارجش کن
                localStorage.removeItem(LOCAL_KEY);
                currentUser = null;
                showLoginPage();
                toast('حساب شما بن شده است', 'error');
            }
        }

        function renderAdminTable(searchTerm = '') {
            const tbody = document.getElementById('adminUsersTable').querySelector('tbody');
            tbody.innerHTML = '';
            const users = Object.values(db.users);
            const filtered = users.filter(u =>
                u.phone.includes(searchTerm) ||
                u.name.includes(searchTerm) ||
                String(u.uid).includes(searchTerm)
            );
            filtered.forEach(u => {
                const row = tbody.insertRow();
                const tickHtml = getTickBadge(u.role);
                const roleTitle = getRoleTitle(u.role);
                const gemsDisplay = (u.gems === Infinity) ? '∞' : u.gems;
                const coinsDisplay = (u.coins === Infinity) ? '∞' : u.coins;
                const banStatus = u.banned ? '<span class="banned-badge">بن شده</span>' : 'فعال';
                row.innerHTML = `
                    <td>${u.uid}</td>
                    <td>${tickHtml} ${u.name}</td>
                    <td>${roleTitle}</td>
                    <td>${gemsDisplay}</td>
                    <td>${coinsDisplay}</td>
                    <td>${banStatus}</td>
                    <td>
                        <button class="btn-small editUserBtn" data-phone="${u.phone}">✏️</button>
                        <button class="btn-small ${u.banned ? 'btn-unban' : 'btn-ban'}" data-banphone="${u.phone}">${u.banned ? 'آنبن' : 'بن'}</button>
                    </td>
                `;
            });
            document.querySelectorAll('.editUserBtn').forEach(btn => {
                btn.onclick = () => openUserForm(btn.dataset.phone);
            });
            document.querySelectorAll('[data-banphone]').forEach(btn => {
                btn.onclick = () => toggleBan(btn.dataset.banphone);
            });
        }

        document.getElementById('adminSearchInput').oninput = (e) => renderAdminTable(e.target.value);
        document.getElementById('refreshAdminTable').onclick = async () => {
            await loadDB();
            renderAdminTable(document.getElementById('adminSearchInput').value);
            toast('لیست کاربران به‌روز شد', 'success');
        };
        document.getElementById('addUserAdminBtn').onclick = () => openUserForm(null);
        document.getElementById('copyShopLinkBtn').onclick = () => {
            navigator.clipboard.writeText(SHOP_LINK);
            toast('لینک فروشگاه کپی شد: ' + SHOP_LINK);
        };

        function openUserForm(phone) {
            targetPhone = phone;
            const u = phone ? db.users[phone] : null;
            document.getElementById('formTitle').innerText = phone ? 'ویرایش کاربر' : 'افزودن کاربر';
            document.getElementById('fPhone').value = u?.phone || '';
            document.getElementById('fName').value = u?.name || '';
            document.getElementById('fPass').value = u?.password || '';
            document.getElementById('fRole').value = u?.role || 'normal';
            document.getElementById('fGems').value = (u?.gems === Infinity) ? 99999 : (u?.gems || 100);
            document.getElementById('fCoins').value = (u?.coins === Infinity) ? 99999 : (u?.coins || 600);
            document.getElementById('userFormOverlay').style.display = 'flex';
        }

        document.getElementById('closeUserFormBtn').onclick = () => document.getElementById('userFormOverlay').style.display = 'none';
        document.getElementById('saveUserFormBtn').onclick = async () => {
            const phone = document.getElementById('fPhone').value.trim();
            if(!phone) return toast('شماره تلفن الزامی است', 'error');
            const gemsRaw = parseInt(document.getElementById('fGems').value);
            const coinsRaw = parseInt(document.getElementById('fCoins').value);
            const role = document.getElementById('fRole').value;
            const userData = {
                phone: phone,
                name: document.getElementById('fName').value.trim(),
                password: document.getElementById('fPass').value.trim(),
                role: role,
                gems: isNaN(gemsRaw) ? 100 : gemsRaw,
                coins: isNaN(coinsRaw) ? 600 : coinsRaw,
                banned: false
            };
            if(targetPhone) {
                if(targetPhone !== phone && db.users[targetPhone]) delete db.users[targetPhone];
                const oldUser = db.users[targetPhone] || {};
                db.users[phone] = {
                    ...oldUser,
                    ...userData,
                    uid: oldUser.uid || (++db.lastUID),
                    avatar: oldUser.avatar || 'avatar1',
                    ownedAvatars: oldUser.ownedAvatars || ['avatar1','avatar2'],
                    editCount: oldUser.editCount || 0,
                    stats: oldUser.stats || { wins:0, losses:0, hours:0, obs:0 },
                    banned: oldUser.banned || false
                };
            } else {
                db.lastUID = (db.lastUID || 0) + 1;
                db.users[phone] = {
                    ...userData,
                    uid: db.lastUID,
                    age: 18,
                    avatar: 'avatar1',
                    ownedAvatars: ['avatar1','avatar2'],
                    editCount: 0,
                    stats: { wins:0, losses:0, hours:0, obs:0 },
                    banned: false
                };
            }
            await saveDB();
            document.getElementById('userFormOverlay').style.display = 'none';
            renderAdminTable(document.getElementById('adminSearchInput').value);
            toast(`کاربر ${userData.name} ذخیره شد. لینک فروشگاه: ${SHOP_LINK}`);
        };

        // ---------- بارگذاری اولیه و چک کردن نشست قبلی ----------
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 15;
            if(loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadInterval);
                document.getElementById('loadBar').style.width = '100%';
                setTimeout(async () => {
                    await loadDB();
                    const saved = localStorage.getItem(LOCAL_KEY);
                    if(saved) {
                        try {
                            const { phone } = JSON.parse(saved);
                            if(phone && db.users[phone] && !db.users[phone].banned) {
                                currentUser = db.users[phone];
                                showGamePage();
                            } else {
                                showLoginPage();
                            }
                        } catch(e) { showLoginPage(); }
                    } else {
                        showLoginPage();
                    }
                }, 500);
            } else {
                document.getElementById('loadBar').style.width = loadProgress + '%';
            }
        }, 200);
    })();
</script>
</body>
</html>
