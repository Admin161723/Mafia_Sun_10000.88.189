<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مافیا سان | بازی اصلی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f0c040; --red: #c0392b; --green: #27ae60; --card: rgba(18, 18, 35, 0.85); --border: #2a2a40; }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { font-family: 'Vazirmatn', sans-serif; background: #0a0c10; color: #e0e0e0; overflow: hidden; height: 100vh; }
        #gamePage { width: 100%; height: 100%; background: url('https://s8.uupload.ir/files/file_00000000ce4071fd96295e0893579ed1_9q9n.png') center/cover; position: relative; }
        .game-header { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .resource-badge { background: var(--card); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
        .profile-btn { position: absolute; top: 15px; left: 15px; display: flex; align-items: center; gap: 8px; background: var(--card); backdrop-filter: blur(8px); padding: 5px 15px 5px 5px; border-radius: 30px; border: 1px solid var(--border); cursor: pointer; z-index: 10; }
        .profile-btn img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--gold); }
        .admin-gear { position: absolute; top: 15px; left: 150px; background: var(--card); backdrop-filter: blur(8px); width: 35px; height: 35px; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); z-index: 10; color: var(--gold); }
        .game-buttons { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); display: flex; gap: 50px; }
        .game-btn { width: 140px; height: 140px; cursor: pointer; transition: 0.2s; }
        .game-btn:active { transform: scale(0.95); }
        .game-btn img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6)); }
        .bottom-bar { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); width: 300px; height: 60px; background: rgba(20, 20, 35, 0.7); backdrop-filter: blur(15px); border-radius: 40px; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; gap: 30px; }
        .bar-item { width: 42px; height: 42px; cursor: pointer; }
        .bar-item img { width: 100%; height: 100%; object-fit: contain; }
        .overlay-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: #1a1a2e; border-radius: 20px; padding: 20px; width: 90%; max-width: 400px; border: 1px solid var(--border); position: relative; }
        .close-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .avatar-item { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .avatar-item.selected { border-color: var(--gold); }
        .avatar-item img { width: 60px; height: 60px; border-radius: 50%; }
        .stat-row { display: flex; gap: 10px; margin: 10px 0; }
        .stat-cell { flex: 1; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; text-align: center; font-size: 0.9rem; }
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 4000; padding: 20px; overflow-y: auto; }
        .admin-content { background: #1e1e30; border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
        .admin-content table { width: 100%; border-collapse: collapse; color: #fff; font-size: 0.75rem; }
        .admin-content th, .admin-content td { padding: 8px 3px; border-bottom: 1px solid #333; text-align: center; }
        .btn-small { padding: 4px 8px; border-radius: 8px; border: none; background: var(--gold); color: #000; font-weight: bold; cursor: pointer; font-size: 0.65rem; margin: 2px; }
        .btn-small.red { background: var(--red); color: #fff; }
        .btn-small.green { background: var(--green); color: #fff; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; padding: 10px 25px; border-radius: 25px; z-index: 5000; border: 1px solid var(--gold); animation: fade 0.3s; z-index: 6000; }
        @keyframes fade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .auth-input { width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff; margin: 6px 0; font-family: inherit; }
        .auth-btn { width: 100%; padding: 12px; border-radius: 40px; background: var(--gold); border: none; font-weight: bold; margin-top: 8px; cursor: pointer; color: #000; }
    </style>
</head>
<body>
    <div id="gamePage">
        <div class="game-header"><div class="resource-badge">💎 <span id="gemVal">0</span></div><div class="resource-badge">🪙 <span id="coinVal">0</span></div></div>
        <div class="profile-btn" id="openProfileBtn"><img id="mainAvatarImg" src=""><span id="mainNameText"></span></div>
        <div class="admin-gear" id="openAdminPanelBtn">⚙️</div>
        <div class="game-buttons"><div class="game-btn" id="competitiveBtn"><img src="https://s8.uupload.ir/files/inshot_20260224_020256460_81p3.png"></div><div class="game-btn" id="serversBtn"><img src="https://s8.uupload.ir/files/inshot_20260224_020314922_6mks.png"></div></div>
        <div class="bottom-bar"><div class="bar-item" id="cupBtn"><img src="https://s8.uupload.ir/files/inshot_20260221_223221592_qet.png"></div><div class="bar-item" id="clanBtn"><img src="https://s8.uupload.ir/files/inshot_20260221_223016526_swue.png"></div><div class="bar-item" id="shopBtn"><img src="https://s8.uupload.ir/files/inshot_20260221_223333561_n7g4.png"></div></div>
    </div>

    <!-- مودال‌ها -->
    <div id="profileOverlay" class="overlay-page"><div class="modal-box"><button class="close-btn" id="closeProfileBtn">&times;</button><img id="profileAvatarImg" style="width:80px;height:80px;border-radius:50%;margin:0 auto;display:block;border:2px solid var(--gold);"><h3 id="profileNameText" style="text-align:center;margin:10px 0;"></h3><div class="stat-row"><div class="stat-cell">🏆 برد: <span id="winStat">0</span></div><div class="stat-cell">📊 باخت: <span id="loseStat">0</span></div></div><div class="stat-row"><div class="stat-cell">⏳ ساعت: <span id="hourStat">0</span></div><div class="stat-cell">👁️ ناظر: <span id="obsStat">0</span></div></div><p style="font-size:0.8rem;color:#aaa;text-align:center;">🆔 کد کاربری: <span id="userIdSpan"></span></p><button class="auth-btn" id="editNameBtn" style="margin-top:10px;">ویرایش نام</button><button class="auth-btn" id="openAvatarEditorBtn">تغییر آواتار</button></div></div>
    <div id="editNameOverlay" class="overlay-page"><div class="modal-box"><button class="close-btn" id="closeEditBtn">&times;</button><h3>تغییر نام</h3><p id="editCostMsg" style="color:var(--gold);font-size:0.8rem;"></p><input type="text" id="newNameInput" class="auth-input" maxlength="12"><button class="auth-btn" id="saveNameBtn">ذخیره</button></div></div>
    <div id="avatarOverlay" class="overlay-page"><div class="modal-box"><button class="close-btn" id="closeAvatarBtn">&times;</button><h3>انتخاب آواتار</h3><div class="avatar-grid" id="avatarGridContainer"></div></div></div>
    <div id="adminOverlay" class="admin-modal"><div class="admin-content"><button class="close-btn" id="closeAdminBtn">&times;</button><h2 style="color:var(--gold);">پنل مدیریت</h2><div style="display:flex; gap:10px; margin:10px 0;"><input type="text" id="adminSearchInput" placeholder="جستجوی کاربر..." style="flex:1; padding:12px; border-radius:12px; background:#111; border:1px solid #444; color:#fff;"><button class="btn-small" id="refreshAdminTable">🔄</button><button class="btn-small" id="addUserAdminBtn">➕ کاربر</button></div><div style="overflow-x:auto;"><table id="adminUsersTable"><thead><tr><th>شماره</th><th>نام</th><th>نقش</th><th>جم</th><th>سکه</th><th>وضعیت بن</th><th>جزئیات بن</th><th>عملیات</th></tr></thead><tbody></tbody></table></div></div></div>
    <div id="userFormOverlay" class="admin-modal"><div class="modal-box"><button class="close-btn" id="closeUserFormBtn">&times;</button><h3 id="formTitle">ویرایش کاربر</h3><input id="fPhone" class="auth-input" placeholder="شماره"><input id="fName" class="auth-input" placeholder="نام"><input id="fPass" class="auth-input" placeholder="رمز"><select id="fRole" class="auth-input"><option value="normal">عادی</option><option value="admin">ادمین</option><option value="observer">ناظر</option><option value="support">پشتیبانی</option><option value="creator">سازنده</option></select><select id="fTick" class="auth-input"><option value="">بدون تیک</option><option value="blue">آبی</option><option value="orange">نارنجی</option><option value="brown">قهوه‌ای</option></select><input id="fGems" class="auth-input" placeholder="جم" type="number"><input id="fCoins" class="auth-input" placeholder="سکه" type="number"><button class="auth-btn" id="saveUserFormBtn">ذخیره</button></div></div>

    <script>
        // ---------- تنظیمات API ----------
        const BIN_ID = '6984ae3a43b1c97be967c32b';
        const API_KEY = '$2a$10$P2f/7ECPzq3HSI.6DSdcr.MaV748WQF7smMQL1bczP6YF4XKwjNvG';
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const AVATARS = {
            'avatar1': 'https://s8.uupload.ir/files/inshot_20260208_214035107_wkwk.png',
            'avatar2': 'https://cdn.imgurl.ir/uploads/e36869_InShot_20260225_191621541.png',
            'ninja': 'https://s8.uupload.ir/files/inshot_20260212_151231364_umrq.png',
            'samurai': 'https://s8.uupload.ir/files/inshot_20260212_151120584_7df6.png',
            'avatar17': 'https://s8.uupload.ir/files/inshot_20260224_194133998_3dcu.png',
            'avatar18': 'https://s8.uupload.ir/files/inshot_20260225_191621541_nutk.png'
        };
        const SPECIALS = [
            { phone:'09904844031', pass:'Admin16172-matin-1000', name:'ᴀᴍᴏᴍɪᴛɪ', role:'creator', tick:'blue', gems:999, coins:999 },
            { phone:'09940940720', pass:'Erfan.sh85', name:'♛✯ Èr£åñ_ʂɧ ✯♛', role:'support', tick:'blue', gems:999, coins:999 },
            { phone:'09324134243', pass:'13851385', name:'محمود', role:'observer', tick:'orange', gems:10, coins:10 },
            { phone:'09908823688', pass:'Player_mafia', name:'•⊰هــیــراد⊱•', role:'observer', tick:'orange', gems:10, coins:10 },
            { phone:'09051396023', pass:'ARAZ1381', name:'elijah021', role:'admin', tick:'brown', gems:10, coins:10 },
            { phone:'09039184457', pass:'13861386', name:'Shadi', role:'admin', tick:'brown', gems:10, coins:10 },
            { phone:'09305075756', pass:'123456789', name:'FARZAM', role:'admin', tick:'brown', gems:10, coins:10 }
        ];

        let db = { users: {}, bans: [] };
        let currentUser = null;
        let syncInterval = null;
        let adminRefresh = null;

        // ---------- توابع پایگاه داده ----------
        async function loadDB() {
            try {
                const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                const data = await res.json();
                if(data.record) {
                    db = data.record;
                    if(!db.bans) db.bans = [];
                    if(!db.users) db.users = {};
                }
                localStorage.setItem('mafia_db_backup', JSON.stringify(db));
            } catch(e) {
                const backup = localStorage.getItem('mafia_db_backup');
                if(backup) db = JSON.parse(backup);
                if(!db.bans) db.bans = [];
            }
            await ensureSpecials();
        }

        async function ensureSpecials() {
            let updated = false;
            for(const s of SPECIALS) {
                if(!db.users[s.phone]) {
                    db.users[s.phone] = {
                        phone: s.phone, password: s.pass, name: s.name, age: 25,
                        role: s.role, tick: s.tick, gems: s.gems, coins: s.coins,
                        avatar: 'avatar1', ownedAvatars: Object.keys(AVATARS),
                        editCount: 0, stats: { wins:0, losses:0, hours:0, obs:0 }
                    };
                    updated = true;
                } else {
                    let u = db.users[s.phone];
                    if(s.role === 'creator' || s.role === 'support') {
                        if(u.gems !== 999) u.gems = 999;
                        if(u.coins !== 999) u.coins = 999;
                    } else {
                        if(u.gems > 10) u.gems = 10;
                        if(u.coins > 10) u.coins = 10;
                    }
                    if(u.tick !== s.tick) u.tick = s.tick;
                    updated = true;
                }
            }
            if(updated) await saveDB();
        }

        async function saveDB() {
            try {
                await fetch(BIN_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY }, body: JSON.stringify(db) });
                localStorage.setItem('mafia_db_backup', JSON.stringify(db));
            } catch(e) { console.warn('ذخیره روی سرور ناموفق'); }
        }

        function getActiveBan(phone) {
            const ban = db.bans.find(b => b.phone === phone && (b.permanent || (b.expiry && b.expiry > Date.now())));
            if(!ban) return null;
            const remaining = ban.permanent ? 'دائمی' : Math.ceil((ban.expiry - Date.now()) / 1000 / 60) + ' دقیقه باقی';
            return { ...ban, remaining };
        }

        function enforceResources(user) {
            if(!user) return;
            const isSpecial = (user.role === 'creator' || user.role === 'support');
            if(isSpecial) {
                if(user.gems !== 999) user.gems = 999;
                if(user.coins !== 999) user.coins = 999;
            } else {
                if(user.gems > 10) user.gems = 10;
                if(user.coins > 10) user.coins = 10;
                if(user.gems < 0) user.gems = 0;
                if(user.coins < 0) user.coins = 0;
            }
        }

        // ---------- همگام‌سازی لحظه‌ای ----------
        async function syncUser() {
            if(!currentUser) return;
            try {
                const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                const data = await res.json();
                const freshDb = data.record;
                if(freshDb && freshDb.users && freshDb.users[currentUser.phone]) {
                    const freshUser = freshDb.users[currentUser.phone];
                    const ban = freshDb.bans ? getActiveBan(currentUser.phone) : null;
                    if(ban) {
                        toast(`⛔ شما بن شدید! دلیل: ${ban.reason} توسط ${ban.bannedBy} - ${ban.remaining}`, 'error');
                        localStorage.removeItem('mafia_user_phone');
                        setTimeout(() => window.location.href = 'index.html', 2000);
                        return;
                    }
                    let changed = false;
                    if(freshUser.gems !== currentUser.gems) { currentUser.gems = freshUser.gems; changed = true; }
                    if(freshUser.coins !== currentUser.coins) { currentUser.coins = freshUser.coins; changed = true; }
                    if(freshUser.name !== currentUser.name) { currentUser.name = freshUser.name; changed = true; }
                    if(freshUser.avatar !== currentUser.avatar) { currentUser.avatar = freshUser.avatar; changed = true; }
                    if(freshUser.tick !== currentUser.tick) { currentUser.tick = freshUser.tick; changed = true; }
                    if(freshUser.role !== currentUser.role) { currentUser.role = freshUser.role; changed = true; }
                    if(JSON.stringify(freshUser.stats) !== JSON.stringify(currentUser.stats)) { currentUser.stats = freshUser.stats; changed = true; }
                    currentUser.ownedAvatars = freshUser.ownedAvatars || currentUser.ownedAvatars;
                    db = freshDb;
                    if(changed) updateUI();
                }
            } catch(e) {}
        }

        function updateUI() {
            if(!currentUser) return;
            document.getElementById('gemVal').innerText = currentUser.gems;
            document.getElementById('coinVal').innerText = currentUser.coins;
            document.getElementById('mainAvatarImg').src = AVATARS[currentUser.avatar] || Object.values(AVATARS)[0];
            let nameHtml = currentUser.name;
            if(currentUser.tick === 'blue') nameHtml = `<i class="fas fa-check-circle" style="color:#3b9eff;"></i> ${currentUser.name}`;
            else if(currentUser.tick === 'orange') nameHtml = `<i class="fas fa-check-circle" style="color:#ffaa00;"></i> ${currentUser.name}`;
            else if(currentUser.tick === 'brown') nameHtml = `<i class="fas fa-check-circle" style="color:#8B4513;"></i> ${currentUser.name}`;
            document.getElementById('mainNameText').innerHTML = nameHtml;
            const isAdmin = (currentUser.role === 'creator' || currentUser.role === 'support' || currentUser.role === 'admin');
            document.getElementById('openAdminPanelBtn').style.display = isAdmin ? 'flex' : 'none';
        }

        function toast(msg, type='info') {
            const old = document.querySelector('.toast'); if(old) old.remove();
            const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
            if(type==='error') t.style.borderColor = '#e74c3c';
            document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
        }

        // ---------- تغییر نام و آواتار ----------
        async function changeName(newName) {
            if(newName.length<2) return toast('نام نامعتبر', 'error');
            if(!currentUser.tick && currentUser.editCount>0 && currentUser.coins < 5) return toast('سکه کافی نیست', 'error');
            if(!currentUser.tick && currentUser.editCount>0) currentUser.coins -= 5;
            currentUser.name = newName;
            currentUser.editCount = (currentUser.editCount||0)+1;
            await saveDB();
            updateUI();
            toast('نام تغییر کرد', 'success');
        }

        async function changeAvatar(avatarKey) {
            currentUser.avatar = avatarKey;
            await saveDB();
            updateUI();
            toast('آواتار تغییر کرد', 'success');
        }

        // ---------- پنل مدیریت ----------
        async function renderAdminTable(filter='') {
            await loadDB();
            const tbody = document.querySelector('#adminUsersTable tbody');
            tbody.innerHTML = '';
            const users = Object.values(db.users).filter(u => u.phone.includes(filter) || u.name.includes(filter));
            for(const u of users) {
                const ban = getActiveBan(u.phone);
                const banInfo = ban ? `${ban.reason}<br><span style="font-size:0.7rem;color:#ffaa66;">توسط: ${ban.bannedBy}<br>${ban.remaining}</span>` : '✅ فعال';
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${u.phone}</td>
                    <td>${u.tick ? (u.tick==='blue'?'🔵':u.tick==='orange'?'🟠':'🟤') : ''} ${u.name}</td>
                    <td>${u.role}</td>
                    <td>${u.gems}</td>
                    <td>${u.coins}</td>
                    <td>${ban ? '🚫 بن' : '✅'}</td>
                    <td style="max-width:150px;">${banInfo}</td>
                    <td>
                        <button class="btn-small editUserBtn" data-phone="${u.phone}">✏️</button>
                        ${ban ? `<button class="btn-small green unbanBtn" data-phone="${u.phone}">لغو بن</button>` : `<button class="btn-small red banBtn" data-phone="${u.phone}">بن</button>`}
                    </td>
                `;
            }
            document.querySelectorAll('.editUserBtn').forEach(btn => btn.onclick = () => openUserForm(btn.dataset.phone));
            document.querySelectorAll('.banBtn').forEach(btn => btn.onclick = () => showBanDialog(btn.dataset.phone));
            document.querySelectorAll('.unbanBtn').forEach(btn => btn.onclick = async () => {
                db.bans = db.bans.filter(b => b.phone !== btn.dataset.phone);
                await saveDB();
                renderAdminTable(document.getElementById('adminSearchInput').value);
                toast('بن لغو شد');
                if(currentUser && currentUser.phone === btn.dataset.phone) syncUser();
            });
        }

        function showBanDialog(phone) {
            const reason = prompt('دلیل بن:');
            if(!reason) return;
            const dur = prompt('مدت بن به دقیقه (0 = دائمی):', '0');
            let expiry = null, permanent = false;
            if(dur === '0') permanent = true;
            else {
                const minutes = parseInt(dur);
                if(isNaN(minutes) || minutes<=0) return toast('مدت نامعتبر');
                expiry = Date.now() + minutes * 60 * 1000;
            }
            db.bans.push({
                phone, reason, permanent, expiry,
                bannedBy: currentUser.name,
                timestamp: Date.now()
            });
            saveDB().then(() => {
                renderAdminTable(document.getElementById('adminSearchInput').value);
                toast(`کاربر ${phone} بن شد`);
                if(currentUser && currentUser.phone === phone) syncUser();
            });
        }

        function openUserForm(phone) {
            const u = phone ? db.users[phone] : null;
            document.getElementById('fPhone').value = u?.phone || '';
            document.getElementById('fName').value = u?.name || '';
            document.getElementById('fPass').value = u?.password || '';
            document.getElementById('fRole').value = u?.role || 'normal';
            document.getElementById('fTick').value = u?.tick || '';
            document.getElementById('fGems').value = u?.gems ?? 10;
            document.getElementById('fCoins').value = u?.coins ?? 10;
            window._editPhone = phone;
            document.getElementById('userFormOverlay').style.display = 'flex';
        }

        document.getElementById('saveUserFormBtn').onclick = async () => {
            const phone = document.getElementById('fPhone').value.trim();
            if(!phone) return toast('شماره الزامی');
            const role = document.getElementById('fRole').value;
            let gems = parseInt(document.getElementById('fGems').value) || 10;
            let coins = parseInt(document.getElementById('fCoins').value) || 10;
            const isSpecial = (role === 'creator' || role === 'support');
            if(isSpecial) { gems = 999; coins = 999; }
            else { if(gems>10) gems=10; if(coins>10) coins=10; }
            const data = {
                phone, name: document.getElementById('fName').value.trim(), password: document.getElementById('fPass').value.trim(),
                role, tick: document.getElementById('fTick').value || null, gems, coins
            };
            if(window._editPhone) {
                if(window._editPhone !== phone) delete db.users[window._editPhone];
                const old = db.users[window._editPhone] || {};
                db.users[phone] = { ...old, ...data, uid: old.uid, ownedAvatars: old.ownedAvatars, stats: old.stats };
            } else {
                db.users[phone] = { ...data, age:18, avatar:'avatar1', ownedAvatars:['avatar1','avatar2'], editCount:0, stats:{wins:0,losses:0,hours:0,obs:0} };
            }
            enforceResources(db.users[phone]);
            await saveDB();
            document.getElementById('userFormOverlay').style.display = 'none';
            renderAdminTable(document.getElementById('adminSearchInput').value);
            toast('کاربر ذخیره شد');
            if(currentUser && currentUser.phone === phone) syncUser();
        };

        // ---------- رویدادهای دکمه‌ها ----------
        document.getElementById('openProfileBtn').onclick = () => {
            document.getElementById('profileAvatarImg').src = AVATARS[currentUser.avatar];
            document.getElementById('profileNameText').innerHTML = document.getElementById('mainNameText').innerHTML;
            document.getElementById('userIdSpan').innerText = currentUser.phone;
            document.getElementById('winStat').innerText = currentUser.stats.wins;
            document.getElementById('loseStat').innerText = currentUser.stats.losses;
            document.getElementById('hourStat').innerText = currentUser.stats.hours;
            document.getElementById('obsStat').innerText = currentUser.stats.obs;
            document.getElementById('profileOverlay').style.display = 'flex';
        };
        document.getElementById('closeProfileBtn').onclick = () => document.getElementById('profileOverlay').style.display = 'none';
        document.getElementById('editNameBtn').onclick = () => {
            document.getElementById('editNameOverlay').style.display = 'flex';
            const cost = (!currentUser.tick && currentUser.editCount>0) ? '۵ سکه' : 'رایگان';
            document.getElementById('editCostMsg').innerText = `هزینه: ${cost}`;
            document.getElementById('newNameInput').value = currentUser.name;
        };
        document.getElementById('closeEditBtn').onclick = () => document.getElementById('editNameOverlay').style.display = 'none';
        document.getElementById('saveNameBtn').onclick = async () => {
            const newName = document.getElementById('newNameInput').value.trim();
            await changeName(newName);
            document.getElementById('editNameOverlay').style.display = 'none';
        };
        document.getElementById('openAvatarEditorBtn').onclick = () => {
            const grid = document.getElementById('avatarGridContainer');
            grid.innerHTML = '';
            for(const [key, url] of Object.entries(AVATARS)) {
                const card = document.createElement('div');
                card.className = 'avatar-item' + (currentUser.avatar === key ? ' selected' : '');
                card.innerHTML = `<img src="${url}"><div>${key}</div>`;
                card.onclick = async () => { await changeAvatar(key); document.getElementById('avatarOverlay').style.display = 'none'; };
                grid.appendChild(card);
            }
            document.getElementById('avatarOverlay').style.display = 'flex';
        };
        document.getElementById('closeAvatarBtn').onclick = () => document.getElementById('avatarOverlay').style.display = 'none';

        document.getElementById('openAdminPanelBtn').onclick = () => {
            renderAdminTable();
            document.getElementById('adminOverlay').style.display = 'flex';
            if(adminRefresh) clearInterval(adminRefresh);
            adminRefresh = setInterval(() => {
                if(document.getElementById('adminOverlay').style.display === 'flex')
                    renderAdminTable(document.getElementById('adminSearchInput').value);
            }, 5000);
        };
        document.getElementById('closeAdminBtn').onclick = () => {
            document.getElementById('adminOverlay').style.display = 'none';
            if(adminRefresh) clearInterval(adminRefresh);
        };
        document.getElementById('adminSearchInput').oninput = e => renderAdminTable(e.target.value);
        document.getElementById('refreshAdminTable').onclick = () => renderAdminTable(document.getElementById('adminSearchInput').value);
        document.getElementById('addUserAdminBtn').onclick = () => openUserForm(null);
        document.getElementById('closeUserFormBtn').onclick = () => document.getElementById('userFormOverlay').style.display = 'none';
        document.getElementById('serversBtn').onclick = () => window.location.href = 'https://admin161723.github.io/Server_MafiaSun10000.20/';
        document.getElementById('shopBtn').onclick = () => window.location.href = 'https://admin161723.github.io/Foroshgahe_MafiaSun.ir/store.html';
        ['competitiveBtn','cupBtn','clanBtn'].forEach(id => document.getElementById(id).onclick = () => toast('به زودی'));

        // ---------- شروع برنامه ----------
        (async () => {
            await loadDB();
            const phone = localStorage.getItem('mafia_user_phone');
            if(!phone || !db.users[phone]) {
                window.location.href = 'index.html';
                return;
            }
            const ban = getActiveBan(phone);
            if(ban) {
                toast(`شما بن هستید! دلیل: ${ban.reason}`, 'error');
                localStorage.removeItem('mafia_user_phone');
                setTimeout(() => window.location.href = 'index.html', 2000);
                return;
            }
            currentUser = db.users[phone];
            enforceResources(currentUser);
            updateUI();
            syncInterval = setInterval(syncUser, 3000);
        })();
    </script>
</body>
</html>
