<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مافیا سان | صفحه اصلی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #f0c040;
            --red: #c0392b;
            --green: #27ae60;
            --card: rgba(18, 18, 35, 0.85);
            --border: #2a2a40;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0c10;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .loading-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://cdn.imgurl.ir/uploads/i13489_file_00000000ce4071fd96295e0893579ed1.png') center/cover;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .loading-circle {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-progress {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }
        .loading-progress div {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), #ffaa00);
            border-radius: 6px;
            transition: width 0.2s;
        }
        .version-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }
        #appContainer {
            flex: 1;
            display: none;
            overflow: hidden;
            position: relative;
        }
        #gamePage {
            display: none;
            width: 100%;
            height: 100%;
            background: url('https://s8.uupload.ir/files/file_00000000ce4071fd96295e0893579ed1_9q9n.png') center/cover;
            position: relative;
            flex-direction: column;
        }
        .game-header {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .resource-badge {
            background: var(--card);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .profile-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            backdrop-filter: blur(8px);
            padding: 5px 15px 5px 5px;
            border-radius: 30px;
            border: 1px solid var(--border);
            cursor: pointer;
            z-index: 10;
        }
        .profile-btn img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--gold);
        }
        .admin-gear {
            position: absolute;
            top: 15px;
            left: 150px;
            background: var(--card);
            backdrop-filter: blur(8px);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border);
            z-index: 10;
            color: var(--gold);
        }
        .game-buttons {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 50px;
        }
        .game-btn {
            width: 140px;
            height: 140px;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-btn:active {
            transform: scale(0.95);
        }
        .game-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.6));
        }
        .bottom-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 60px;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .bar-item {
            width: 42px;
            height: 42px;
            cursor: pointer;
        }
        .bar-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .overlay-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .profile-card,
        .avatar-card,
        .edit-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
        }
        .close-btn {
            float: right;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .avatar-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .avatar-item.selected {
            border-color: var(--gold);
        }
        .avatar-item img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }
        .stat-row {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .stat-cell {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
        }
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 4000;
            padding: 20px;
            overflow-y: auto;
        }
        .admin-content {
            background: #1e1e30;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
        }
        .admin-content table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-size: 0.8rem;
        }
        .admin-content th,
        .admin-content td {
            padding: 10px 5px;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        .btn-small {
            padding: 5px 10px;
            border-radius: 8px;
            border: none;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
            margin: 2px;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 10px 25px;
            border-radius: 25px;
            z-index: 5000;
            border: 1px solid var(--gold);
            font-size: 0.9rem;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: var(--gold);
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="loadingPage" class="loading-page">
        <div class="loading-circle"></div>
        <div class="loading-progress"><div id="loadBar" style="width:0%"></div></div>
        <div class="version-text">نسخه ۲.۰.۰ - Mafia Sun</div>
    </div>

    <div id="appContainer">
        <div id="gamePage">
            <div class="game-header">
                <div class="resource-badge">💎 <span id="gemVal">0</span></div>
                <div class="resource-badge">🪙 <span id="coinVal">0</span></div>
            </div>
            <div class="profile-btn" id="openProfileBtn">
                <img id="mainAvatarImg" src="" alt="avatar">
                <span id="mainNameText">بازیکن</span>
            </div>
            <div class="admin-gear" id="openAdminPanelBtn">⚙️</div>
            <div class="game-buttons">
                <div class="game-btn" id="competitiveBtn"><img src="https://s8.uupload.ir/files/inshot_20260224_020256460_81p3.png" alt="رقابتی"></div>
                <div class="game-btn" id="serversBtn"><img src="https://s8.uupload.ir/files/inshot_20260224_020314922_6mks.png" alt="سرورها"></div>
            </div>
            <div class="bottom-bar">
                <div class="bar-item" id="cupBtn"><img src="https://s8.uupload.ir/files/inshot_20260221_223221592_qet.png" alt="کاپ"></div>
                <div class="bar-item" id="clanBtn"><img src="https://s8.uupload.ir/files/inshot_20260221_223016526_swue.png" alt="کلن"></div>
                <div class="bar-item" id="shopBtn"><img src="https://s8.uupload.ir/files/inshot_20260221_223333561_n7g4.png" alt="فروشگاه"></div>
            </div>
        </div>
    </div>

    <div id="profileOverlay" class="overlay-page">
        <div class="profile-card">
            <button class="close-btn" id="closeProfileBtn">&times;</button>
            <img id="profileAvatarImg" style="width:80px; height:80px; border-radius:50%; margin:0 auto; display:block; border:2px solid var(--gold);" alt="profile avatar">
            <h3 id="profileNameText" style="text-align:center; margin:10px 0;"></h3>
            <div class="stat-row">
                <div class="stat-cell">🏆 برد: <span id="winStat">0</span></div>
                <div class="stat-cell">📊 باخت: <span id="loseStat">0</span></div>
            </div>
            <div class="stat-row">
                <div class="stat-cell">⏳ ساعت: <span id="hourStat">0</span></div>
                <div class="stat-cell">👁️ ناظر: <span id="obsStat">0</span></div>
            </div>
            <p style="font-size:0.8rem; color:#aaa; text-align:center;">🆔 کد کاربری: <span id="userIdSpan"></span></p>
            <button class="auth-btn" id="editNameBtn">ویرایش نام</button>
            <button class="auth-btn" id="openAvatarEditorBtn">تغییر آواتار</button>
        </div>
    </div>

    <div id="editNameOverlay" class="overlay-page">
        <div class="edit-card">
            <button class="close-btn" id="closeEditBtn">&times;</button>
            <h3>تغییر نام</h3>
            <p id="editCostMsg" style="color:var(--gold); font-size:0.8rem;"></p>
            <input type="text" id="newNameInput" maxlength="12" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
            <button class="auth-btn" id="saveNameBtn">ذخیره</button>
        </div>
    </div>

    <div id="avatarOverlay" class="overlay-page">
        <div class="avatar-card">
            <button class="close-btn" id="closeAvatarBtn">&times;</button>
            <h3>انتخاب آواتار</h3>
            <div class="avatar-grid" id="avatarGridContainer"></div>
        </div>
    </div>

    <div id="adminOverlay" class="admin-modal">
        <div class="admin-content">
            <button class="close-btn" id="closeAdminBtn">&times;</button>
            <h2 style="color:var(--gold);">پنل مدیریت</h2>
            <input type="text" id="adminSearchInput" placeholder="جستجوی کاربر..." style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
            <button class="auth-btn" id="addUserAdminBtn" style="margin-bottom:10px;">افزودن کاربر جدید</button>
            <div style="overflow-x:auto; margin-top:15px;">
                <table id="adminUsersTable">
                    <thead><tr><th>شماره</th><th>نام</th><th>نقش</th><th>جم</th><th>سکه</th><th>وضعیت</th><th>عملیات</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="userFormOverlay" class="admin-modal">
        <div class="edit-card">
            <button class="close-btn" id="closeUserFormBtn">&times;</button>
            <h3 id="formTitle">افزودن/ویرایش کاربر</h3>
            <input id="fPhone" placeholder="شماره" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
            <input id="fName" placeholder="نام" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
            <input id="fPass" placeholder="رمز" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
            <select id="fRole" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
                <option value="normal">عادی</option>
                <option value="admin">ادمین</option>
                <option value="observer">ناظر</option>
                <option value="support">پشتیبانی</option>
                <option value="creator">سازنده</option>
            </select>
            <select id="fTick" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
                <option value="">بدون تیک</option>
                <option value="blue">آبی</option>
                <option value="orange">نارنجی</option>
                <option value="brown">قهوه‌ای</option>
            </select>
            <input id="fGems" placeholder="جم" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
            <input id="fCoins" placeholder="سکه" style="width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,0.4); border:1px solid var(--border); color:#fff; margin:8px 0;">
            <button class="auth-btn" id="saveUserFormBtn">ذخیره</button>
        </div>
    </div>

    <script>
        (function() {
            const BIN_ID = '6984ae3a43b1c97be967c32b';
            const API_KEY = '$2a$10$P2f/7ECPzq3HSI.6DSdcr.MaV748WQF7smMQL1bczP6YF4XKwjNvG';
            const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
            const AVATARS = {
                'avatar1': 'https://s8.uupload.ir/files/inshot_20260208_214035107_wkwk.png',
                'avatar2': 'https://cdn.imgurl.ir/uploads/e36869_InShot_20260225_191621541.png',
                'ninja': 'https://s8.uupload.ir/files/inshot_20260212_151231364_umrq.png',
                'samurai': 'https://s8.uupload.ir/files/inshot_20260212_151120584_7df6.png',
                'avatar17': 'https://s8.uupload.ir/files/inshot_20260224_194133998_3dcu.png',
                'avatar18': 'https://s8.uupload.ir/files/inshot_20260225_191621541_nutk.png'
            };
            const SPECIALS = [
                { phone:'09904844031', pass:'Admin16172-matin-1000', name:'ᴀᴍᴏᴍɪᴛɪ', role:'creator', tick:'blue' },
                { phone:'09940940720', pass:'Erfan.sh85', name:'♛✯ Èr£åñ_ʂɧ ✯♛', role:'support', tick:'blue' },
                { phone:'09324134243', pass:'13851385', name:'محمود', role:'observer', tick:'orange' },
                { phone:'09908823688', pass:'Player_mafia', name:'•⊰هــیــراد⊱•', role:'observer', tick:'orange' },
                { phone:'09051396023', pass:'ARAZ1381', name:'elijah021', role:'admin', tick:'brown' },
                { phone:'09039184457', pass:'13861386', name:'Shadi', role:'admin', tick:'brown' },
                { phone:'09305075756', pass:'123456789', name:'FARZAM', role:'admin', tick:'brown' }
            ];

            let db = { users: {}, bans: [] };
            let currentUser = null;
            let currentSession = null;
            let targetPhone = null;
            const LOCAL_KEY = 'mafia_sun_session';

            async function loadDB() {
                try {
                    const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
                    const data = await res.json();
                    db = data.record || db;
                    localStorage.setItem('mafia_db_backup', JSON.stringify(db));
                } catch(e) {
                    const backup = localStorage.getItem('mafia_db_backup');
                    if(backup) db = JSON.parse(backup);
                }
                await ensureSpecials();
                autoLogin();
            }

            async function saveDB() {
                try {
                    await fetch(BIN_URL, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(db)
                    });
                    localStorage.setItem('mafia_db_backup', JSON.stringify(db));
                } catch(e) { console.warn('ذخیره روی سرور ناموفق'); }
            }

            async function ensureSpecials() {
                let updated = false;
                for(const s of SPECIALS) {
                    if(!db.users[s.phone]) {
                        db.users[s.phone] = {
                            phone: s.phone, password: s.pass, name: s.name, age: 25, role: s.role, tick: s.tick,
                            gems: Infinity, coins: Infinity, avatar: 'avatar1', ownedAvatars: Object.keys(AVATARS),
                            editCount: 0, stats: { wins:0, losses:0, hours:0, obs:0 }
                        };
                        updated = true;
                    }
                }
                if(updated) await saveDB();
            }

            function autoLogin() {
                const session = localStorage.getItem(LOCAL_KEY);
                if(session) {
                    try {
                        const s = JSON.parse(session);
                        if(s.phone && db.users[s.phone]) {
                            currentUser = db.users[s.phone];
                            currentSession = s;
                            showGamePage();
                            return;
                        }
                    } catch(e) {}
                }
                showGamePage();
            }

            function loginUser(phone) {
                currentUser = db.users[phone];
                currentSession = { phone: phone, token: Date.now() + Math.random().toString(36) };
                localStorage.setItem(LOCAL_KEY, JSON.stringify(currentSession));
                showGamePage();
            }

            function showGamePage() {
                document.getElementById('gamePage').style.display = 'block';
                if(currentUser) updateUI();
            }

            function updateUI() {
                if(!currentUser) return;
                document.getElementById('gemVal').innerText = currentUser.gems === Infinity ? '∞' : currentUser.gems;
                document.getElementById('coinVal').innerText = currentUser.coins === Infinity ? '∞' : currentUser.coins;
                document.getElementById('mainAvatarImg').src = AVATARS[currentUser.avatar] || Object.values(AVATARS)[0];
                document.getElementById('mainNameText').innerText = currentUser.name;
                document.getElementById('openAdminPanelBtn').style.display =
                    (currentUser.role === 'creator' || currentUser.role === 'admin') ? 'flex' : 'none';
            }

            function toast(msg, type='info') {
                const old = document.querySelector('.toast');
                if(old) old.remove();
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                if(type === 'error') t.style.borderColor = '#e74c3c';
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2500);
            }

            // دکمه فروشگاه
            document.getElementById('shopBtn').onclick = () => {
                window.location.href = 'https://admin161723.github.io/Foroshgahe_MafiaSun.ir/store.html';
            };

            document.getElementById('serversBtn').onclick = () => {
                window.location.href = 'https://admin161723.github.io/Server_MafiaSun10000.20/';
            };

            ['competitiveBtn', 'cupBtn', 'clanBtn'].forEach(id => {
                document.getElementById(id).onclick = () => toast('به زودی');
            });

            // پروفایل
            document.getElementById('openProfileBtn').onclick = () => {
                if(!currentUser) return toast('وارد نشده‌اید');
                document.getElementById('profileAvatarImg').src = AVATARS[currentUser.avatar] || Object.values(AVATARS)[0];
                document.getElementById('profileNameText').innerText = currentUser.name;
                document.getElementById('userIdSpan').innerText = currentUser.phone;
                document.getElementById('winStat').innerText = currentUser.stats?.wins || 0;
                document.getElementById('loseStat').innerText = currentUser.stats?.losses || 0;
                document.getElementById('hourStat').innerText = currentUser.stats?.hours || 0;
                document.getElementById('obsStat').innerText = currentUser.stats?.obs || 0;
                document.getElementById('profileOverlay').style.display = 'flex';
            };
            document.getElementById('closeProfileBtn').onclick = () => {
                document.getElementById('profileOverlay').style.display = 'none';
            };

            // ویرایش نام
            document.getElementById('editNameBtn').onclick = () => {
                document.getElementById('editNameOverlay').style.display = 'flex';
                const cost = (!currentUser.tick && currentUser.editCount > 0) ? '۵ سکه' : 'رایگان';
                document.getElementById('editCostMsg').innerText = `هزینه: ${cost}`;
                document.getElementById('newNameInput').value = currentUser.name;
            };
            document.getElementById('closeEditBtn').onclick = () => {
                document.getElementById('editNameOverlay').style.display = 'none';
            };
            document.getElementById('saveNameBtn').onclick = async () => {
                const newName = document.getElementById('newNameInput').value.trim();
                if(newName.length < 2) return toast('نام نامعتبر', 'error');
                if(!currentUser.tick && currentUser.editCount > 0 && currentUser.coins < 5) {
                    return toast('سکه کافی نیست', 'error');
                }
                if(!currentUser.tick && currentUser.editCount > 0) {
                    currentUser.coins -= 5;
                }
                currentUser.name = newName;
                currentUser.editCount = (currentUser.editCount || 0) + 1;
                await saveDB();
                updateUI();
                document.getElementById('editNameOverlay').style.display = 'none';
                toast('نام تغییر کرد', 'success');
            };

            // آواتار
            document.getElementById('openAvatarEditorBtn').onclick = () => {
                const grid = document.getElementById('avatarGridContainer');
                grid.innerHTML = '';
                for(const [key, url] of Object.entries(AVATARS)) {
                    const card = document.createElement('div');
                    card.className = 'avatar-item' + (currentUser.avatar === key ? ' selected' : '');
                    card.innerHTML = `<img src="${url}" alt="${key}"><span>${key}</span>`;
                    card.onclick = async () => {
                        currentUser.avatar = key;
                        await saveDB();
                        updateUI();
                        document.getElementById('avatarOverlay').style.display = 'none';
                        toast('آواتار تغییر کرد', 'success');
                    };
                    grid.appendChild(card);
                }
                document.getElementById('avatarOverlay').style.display = 'flex';
            };
            document.getElementById('closeAvatarBtn').onclick = () => {
                document.getElementById('avatarOverlay').style.display = 'none';
            };

            // پنل مدیریت
            document.getElementById('openAdminPanelBtn').onclick = () => {
                renderAdminTable();
                document.getElementById('adminOverlay').style.display = 'flex';
            };
            document.getElementById('closeAdminBtn').onclick = () => {
                document.getElementById('adminOverlay').style.display = 'none';
            };

            function renderAdminTable(filter = '') {
                const tbody = document.getElementById('adminUsersTable').querySelector('tbody');
                tbody.innerHTML = '';
                const users = Object.values(db.users).filter(u =>
                    u.phone.includes(filter) || u.name.includes(filter)
                );
                users.forEach(u => {
                    const isBanned = db.bans.some(b =>
                        b.phone === u.phone && (b.permanent || b.expiry > Date.now())
                    );
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${u.phone}</td>
                        <td>${u.tick ? '🔵' : ''}${u.name}</td>
                        <td>${u.role}</td>
                        <td>${u.gems === Infinity ? '∞' : u.gems}</td>
                        <td>${u.coins === Infinity ? '∞' : u.coins}</td>
                        <td>${isBanned ? '🚫' : '✅'}</td>
                        <td>
                            <button class="btn-small editUserBtn" data-phone="${u.phone}">✏️</button>
                            <button class="btn-small banUserBtn" data-phone="${u.phone}">🔨</button>
                        </td>`;
                });
                document.querySelectorAll('.editUserBtn').forEach(b => {
                    b.onclick = () => openUserForm(b.dataset.phone);
                });
                document.querySelectorAll('.banUserBtn').forEach(b => {
                    b.onclick = () => {
                        if(confirm('بن کردن کاربر؟')) {
                            db.bans.push({ phone: b.dataset.phone, permanent: true });
                            saveDB().then(() => renderAdminTable());
                        }
                    };
                });
            }

            document.getElementById('adminSearchInput').oninput = e => renderAdminTable(e.target.value);
            document.getElementById('addUserAdminBtn').onclick = () => openUserForm(null);

            function openUserForm(phone) {
                document.getElementById('userFormOverlay').style.display = 'flex';
                document.getElementById('formTitle').innerText = phone ? 'ویرایش کاربر' : 'افزودن کاربر';
                const u = phone ? db.users[phone] : null;
                document.getElementById('fPhone').value = u?.phone || '';
                document.getElementById('fName').value = u?.name || '';
                document.getElementById('fPass').value = u?.password || '';
                document.getElementById('fRole').value = u?.role || 'normal';
                document.getElementById('fTick').value = u?.tick || '';
                document.getElementById('fGems').value = u?.gems === Infinity ? 99999 : (u?.gems || 100);
                document.getElementById('fCoins').value = u?.coins === Infinity ? 99999 : (u?.coins || 600);
                targetPhone = phone;
            }

            document.getElementById('closeUserFormBtn').onclick = () => {
                document.getElementById('userFormOverlay').style.display = 'none';
            };

            document.getElementById('saveUserFormBtn').onclick = async () => {
                const phone = document.getElementById('fPhone').value.trim();
                const data = {
                    phone,
                    name: document.getElementById('fName').value.trim(),
                    password: document.getElementById('fPass').value.trim(),
                    role: document.getElementById('fRole').value,
                    tick: document.getElementById('fTick').value || null,
                    gems: parseInt(document.getElementById('fGems').value) || 100,
                    coins: parseInt(document.getElementById('fCoins').value) || 600
                };
                if(targetPhone) {
                    if(targetPhone !== phone) delete db.users[targetPhone];
                    db.users[phone] = { ...db.users[targetPhone], ...data };
                } else {
                    db.users[phone] = {
                        ...data,
                        age: 18,
                        avatar: 'avatar1',
                        ownedAvatars: ['avatar1', 'avatar2'],
                        editCount: 0,
                        stats: { wins:0, losses:0, hours:0, obs:0 }
                    };
                }
                await saveDB();
                document.getElementById('userFormOverlay').style.display = 'none';
                renderAdminTable();
                toast('کاربر ذخیره شد', 'success');
            };

            // لودینگ
            let loadProgress = 0;
            const loadInterval = setInterval(() => {
                loadProgress += Math.random() * 15;
                if(loadProgress >= 100) {
                    loadProgress = 100;
                    clearInterval(loadInterval);
                    document.getElementById('loadBar').style.width = '100%';
                    setTimeout(async () => {
                        await loadDB();
                        document.getElementById('loadingPage').style.display = 'none';
                        document.getElementById('appContainer').style.display = 'block';
                    }, 500);
                } else {
                    document.getElementById('loadBar').style.width = loadProgress + '%';
                }
            }, 200);
        })();
    </script>
</body>
</html>
